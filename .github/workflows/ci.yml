name: Validate Midnight Ink
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: midnight_ink_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: midnight_ink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midnight_ink_test -d midnight_ink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://midnight_ink_test:disposable-ci-password@127.0.0.1:5432/midnight_ink_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
